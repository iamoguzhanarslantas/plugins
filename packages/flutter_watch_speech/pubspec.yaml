name: flutter_watch_speech
description: "Text to speech for Flutter on Apple Watch: AVSpeechSynthesizer via dart:ffi, with voices, rate, pitch, queued utterances and ducking."
version: 0.0.1
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins/tree/main/packages/flutter_watch_speech
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - tts
  - speech

environment:
  # 3.1 is where NativeCallable.listener landed — the push path this package
  # depends on.
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a
        # static archive force-loaded into the watch binary; Dart
        # resolves the exported symbols via DynamicLibrary.process().
        # Method-channel plugins are not supported on watchOS,
        # so this is the supported plugin model.
        ffiPlugin: true
        dartPluginClass: WatchSpeech
        # C symbols exported for dart:ffi lookup. They survive the link
        # because the CLI force-loads the plugin archive, each export is
        # marked used with default visibility, and the CLI keeps global
        # symbols through the App Store strip.
        ffiSymbols:
          - flutter_watch_speech_set_callback
          - flutter_watch_speech_speak
          - flutter_watch_speech_stop
          - flutter_watch_speech_pause
          - flutter_watch_speech_resume
          - flutter_watch_speech_is_speaking
          - flutter_watch_speech_is_paused
          - flutter_watch_speech_voices
          - flutter_watch_speech_current_language
          - flutter_watch_speech_poll_events
          - flutter_watch_speech_release
